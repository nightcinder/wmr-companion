name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: wmr_fusion package
        working-directory: packages/wmr_fusion
        run: |
          dart pub get
          dart analyze
          dart test
      # Monado's config key (BSL-1.0) is not committed. It is fetched here so the
      # test APK can decode a controller config block; it ends up only inside the
      # APK artifact, together with assets/monado/NOTICE.txt. A failed download
      # must not fail CI: the app reports a missing key.
      - name: Fetch Monado config key
        continue-on-error: true
        run: dart run tool/fetch_wmr_config_key.dart
      - name: Show whether the key is in the build
        run: ls -l assets/monado/
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: wmr-companion-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  gatt-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run GATT probe unit tests
        working-directory: tool/gatt_probe
        run: ./gradlew test --stacktrace

      - name: Build GATT probe APK
        working-directory: tool/gatt_probe
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wmr-gatt-probe-debug-apk
          path: tool/gatt_probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

