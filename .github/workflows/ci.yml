name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test packages/wmr_fusion packages/wmr_core packages/wmr_companion packages/wmr_ble packages/wmr_companion_ui packages/wmr_companion_hid_android example/lib example/test
      - run: flutter analyze
      - run: flutter test
      - name: wmr_core package
        working-directory: packages/wmr_core
        run: |
          dart pub get
          dart analyze
          dart test
      - name: wmr_core stays pure Dart
        run: |
          set -eu
          test -d packages/wmr_core/lib
          if grep -rnE "package:(flutter|flutter_riverpod|universal_ble|path_provider|share_plus|permission_handler)/|import 'dart:ui'" packages/wmr_core/lib; then
            echo "wmr_core must not import Flutter, Riverpod, dart:ui or plugins"
            exit 1
          fi
      - name: wmr_companion package
        working-directory: packages/wmr_companion
        run: |
          dart pub get
          dart analyze
          dart test
      - name: wmr_companion stays framework-agnostic
        run: |
          set -eu
          test -d packages/wmr_companion/lib
          if grep -rnE "package:(flutter|flutter_riverpod|universal_ble|path_provider|share_plus|permission_handler)/|import 'dart:ui'" packages/wmr_companion/lib; then
            echo "wmr_companion must not import Flutter, Riverpod, dart:ui or plugins"
            exit 1
          fi
      - name: wmr_companion public surface is in the barrel only
        run: |
          set -eu
          test -f packages/wmr_companion/lib/wmr_companion.dart
          test -f packages/wmr_companion/lib/testing.dart
          if find packages/wmr_companion/lib -maxdepth 1 -name '*.dart' \
              ! -name 'wmr_companion.dart' ! -name 'testing.dart' | grep .; then
            echo "only wmr_companion.dart and testing.dart may be top-level libraries"
            exit 1
          fi
      - name: wmr_companion_hid_android package
        working-directory: packages/wmr_companion_hid_android
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: wmr_companion_hid_android stays app-free
        run: |
          set -eu
          test -d packages/wmr_companion_hid_android/lib
          if grep -rnE "package:(flutter_riverpod|wmr_companion_app|wmr_core)/" packages/wmr_companion_hid_android/lib; then
            echo "wmr_companion_hid_android must not import Riverpod, wmr_core internals or the app"
            exit 1
          fi
      - name: wmr_companion_ui package
        working-directory: packages/wmr_companion_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: wmr_companion_ui stays UI-only
        run: |
          set -eu
          test -d packages/wmr_companion_ui/lib
          if grep -rnE "package:(flutter_riverpod|wmr_core|wmr_companion_app)/|import 'dart:ui'" packages/wmr_companion_ui/lib; then
            echo "wmr_companion_ui must not import Riverpod, wmr_core internals, dart:ui or the app"
            exit 1
          fi
      - name: wmr_ble package
        working-directory: packages/wmr_ble
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: wmr_ble stays UI- and app-free
        run: |
          set -eu
          test -d packages/wmr_ble/lib
          if grep -rnE "package:(flutter_riverpod|wmr_companion_app)/|import 'package:flutter/|import 'dart:ui'" packages/wmr_ble/lib; then
            echo "wmr_ble must not import Riverpod, the app, dart:ui or widget libraries"
            exit 1
          fi
      - name: wmr_fusion package
        working-directory: packages/wmr_fusion
        run: |
          dart pub get
          dart analyze
          dart test
      - name: pub.dev publish dry-run (6 packages)
        run: |
          # Verify package publishability on pub.dev.
          # wmr_fusion has no inter-package path dependencies and must pass cleanly.
          # wmr_core, wmr_companion, wmr_ble, wmr_companion_ui, and wmr_companion_hid_android
          # retain path dependencies until their first published release (see docs/PUBLISHING.md).
          # dart pub publish --dry-run flags path dependencies; we allow them to fail soft until published.
          echo "=== Publish dry-run: wmr_fusion ==="
          (cd packages/wmr_fusion && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_core (fails soft on path deps: see docs/PUBLISHING.md) ==="
          (cd packages/wmr_core && dart pub publish --dry-run) || true

          echo "=== Publish dry-run: wmr_companion (fails soft on path deps: see docs/PUBLISHING.md) ==="
          (cd packages/wmr_companion && dart pub publish --dry-run) || true

          echo "=== Publish dry-run: wmr_ble (fails soft on path deps: see docs/PUBLISHING.md) ==="
          (cd packages/wmr_ble && flutter pub publish --dry-run) || true

          echo "=== Publish dry-run: wmr_companion_ui (fails soft on path deps: see docs/PUBLISHING.md) ==="
          (cd packages/wmr_companion_ui && flutter pub publish --dry-run) || true

          echo "=== Publish dry-run: wmr_companion_hid_android (fails soft on path deps: see docs/PUBLISHING.md) ==="
          (cd packages/wmr_companion_hid_android && flutter pub publish --dry-run) || true
      # Monado's config key (BSL-1.0) is not committed. It is fetched here so the
      # test APK can decode a controller config block; it ends up only inside the
      # APK artifact, together with assets/monado/NOTICE.txt. A failed download
      # must not fail CI: the app reports a missing key.
      - name: Fetch Monado config key
        continue-on-error: true
        run: dart run tool/fetch_wmr_config_key.dart
      - name: Show whether the key is in the build
        run: ls -l assets/monado/
      - run: flutter build apk --debug

      - name: Example app
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: wmr-companion-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  gatt-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run GATT probe unit tests
        working-directory: tool/gatt_probe
        run: ./gradlew test --stacktrace

      - name: Build GATT probe APK
        working-directory: tool/gatt_probe
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wmr-gatt-probe-debug-apk
          path: tool/gatt_probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Test WMRCompanionKit Swift Package
        working-directory: packages/WMRCompanionKit
        run: swift test

      - name: Build WMRCompanionProbe
        working-directory: tool/ios_probe
        run: swift build

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Validate Flutter iOS config
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign

      - name: Validate example iOS config
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign
