name: Release dex check

# ONY-782: an R8 `-keep` rule can only be proved on a minified unified APK.
# `release-unified` is tag-gated, so a PR touching the R8 rules or a JNI path
# had no artifact that proved the keep rules hold. This builds the same release
# APK on the self-hosted runner, runs the APK checker on it and keeps the APK as
# evidence. It is not a required check and publishes nothing.
#
# It lives in its own workflow so the path filter covers exactly what it needs:
# editing `ci.yml` (twelve jobs that this one does not run) no longer pays for a
# full release build, while editing this file or a composite action it uses
# still does.
on:
  pull_request:
    paths:
      # R8 rules and the Gradle configuration that applies them.
      - 'apps/wmr_companion_app/android/app/proguard-rules.pro'
      - 'apps/wmr_companion_app/android/**/*.gradle.kts'
      - 'apps/wmr_companion_app/android/gradle.properties'
      - 'apps/wmr_companion_app/android/gradle/wrapper/gradle-wrapper.properties'
      # Kotlin/Java that is packaged, plus every manifest that merges into the
      # APK (AGP keeps manifest-referenced classes by default).
      - 'apps/wmr_companion_app/android/app/src/main/**/*.kt'
      - 'apps/wmr_companion_app/android/app/src/main/**/*.java'
      - 'apps/wmr_companion_app/android/app/src/*/AndroidManifest.xml'
      - 'apps/wmr_companion_app/android/xr_extensions_stubs/src/main/**/*.java'
      - 'packages/*/android/**/*.gradle.kts'
      - 'packages/*/android/src/main/**/*.kt'
      - 'packages/*/android/src/main/**/*.java'
      - 'packages/*/android/src/main/AndroidManifest.xml'
      # This job runs `./.github/actions/flutter-setup`; changing the action
      # must exercise the build.
      - '.github/actions/**'
      # Editing this workflow must exercise it.
      - '.github/workflows/release-dex-check.yml'

# A new push to the same PR cancels the older run: only the newest head's dex
# is worth building.
concurrency:
  group: release-dex-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-dex-check:
    # Same-repo pull requests only: the job needs the release keystore and the
    # proprietary VITURE SDK, neither of which a fork run may receive.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, liesa, android]
    timeout-minutes: 40
    env:
      # Same approved export and pins as `release-unified`. The export is
      # downloaded per run rather than read from a host directory, because a
      # mounted copy can drift from the checksum-verified asset.
      UNITY_EXPORT_TAG: unity-export-1.4
      ANDROID_NDK_VERSION: 28.2.13676358
      ANDROID_CMAKE_VERSION: 3.22.1
      UNITY_EXPORT_SHA256: da077615c7925a37fea7c41f8815ff2ff25e760b7c5c4be3c04f84a7467bfae3
    steps:
      - uses: actions/checkout@v7

      # `liesa` is a plain host, not the GitHub-hosted image: it exports no
      # ANDROID_HOME and carries only the tools its owner installed. Fail here,
      # before the build, naming exactly what is missing.
      - name: Preflight the self-hosted runner
        run: |
          set -euo pipefail
          missing=()
          for tool in gh python3 git base64 sha256sum unzip; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::liesa is missing ${missing[*]}; add them to the runner image. This job does not apt-install."
            exit 1
          fi

      - name: Locate the Android SDK
        id: android-sdk
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            for candidate in "$HOME/Android/Sdk" /usr/local/lib/android/sdk /opt/android-sdk /opt/android/sdk; do
              if [ -d "$candidate" ]; then sdk="$candidate"; break; fi
            done
          fi
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::No Android SDK on liesa: ANDROID_HOME/ANDROID_SDK_ROOT are unset and no SDK sits in the usual places. Install one on the runner image."
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "Android SDK: $sdk"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the pinned NDK and CMake
        run: |
          # Not `pipefail`: `yes` exits with SIGPIPE once sdkmanager stops
          # reading its licence prompts, which is not a failure here.
          set -eu
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cmake="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          if [ ! -d "$ndk" ] || [ ! -d "$cmake" ]; then
            sdkmanager="$(command -v sdkmanager || true)"
            if [ -z "$sdkmanager" ]; then
              sdkmanager="$(find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager | head -n 1 || true)"
            fi
            if [ -z "$sdkmanager" ]; then
              echo "::error::sdkmanager not found under $ANDROID_HOME; cannot install ndk;$ANDROID_NDK_VERSION and cmake;$ANDROID_CMAKE_VERSION."
              exit 1
            fi
            [ -d "$ndk" ] || yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;$ANDROID_NDK_VERSION"
            [ -d "$cmake" ] || yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" "cmake;$ANDROID_CMAKE_VERSION"
          fi
          test -d "$ndk"
          test -d "$cmake"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "NDK: $ndk"
          echo "CMake: $cmake"

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/flutter-setup

      - run: flutter pub get

      # The APK checker requires the Monado config key. Same pinned download
      # as `release-unified`; a failed download fails this job rather than
      # producing an APK that cannot pass the checker.
      - name: Fetch Monado config key
        working-directory: apps/wmr_companion_app
        run: |
          set -euo pipefail
          dart run ../../tool/fetch_wmr_config_key.dart \
            --url https://gitlab.freedesktop.org/monado/monado/-/raw/01c6e4ed28dc6e85b84d4683831947862a64844c/src/xrt/drivers/wmr/wmr_config_key.h
          test "$(stat -c%s assets/monado/wmr_config_key.bin)" = "1024"
          echo "f0fbc70a916dbe0b87e9162ddee6b9fd768696354d9cd3cd0e7f9ddd90f6f1dc  assets/monado/wmr_config_key.bin" \
            | sha256sum --check --strict

      # A release build refuses to run without the project key (ONY-492), and
      # same-repo pull requests receive repository secrets. The signature is
      # incidental here: the dex is the artifact under test.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WMR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::WMR_RELEASE_KEYSTORE_BASE64 is not set; nothing can be signed."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > apps/wmr_companion_app/android/wmr-release.keystore

      # Gate 1, the checkerboard captures and Gate 9 call into the VITURE C
      # SDK, so a release built without libglasses.so reports sdkUnavailable
      # for all three (ONY-740). The SDK is proprietary and is neither
      # committed nor published as an asset: it lives on the licensed
      # self-hosted runner, pinned by size and digest. Failing here beats
      # publishing another APK that cannot run the bench.
      - name: Stage the VITURE C SDK
        env:
          VITURE_SDK_DIR: /home/liesa/.local/share/viture-sdk/2.4.1
        run: |
          set -euo pipefail
          src="$VITURE_SDK_DIR/libglasses.so"
          if [ ! -f "$src" ]; then
            echo "::error::$src is missing; stage VITURE XR Glasses SDK for Android 2.4.1 on the runner."
            exit 1
          fi
          test "$(stat -c%s "$src")" = "2076360" \
            || { echo "::error::$src is not the 2,076,360-byte 2.4.1 build"; exit 1; }
          echo "8ac615769b76cfe6fa05354b73048117f3d6ba2f54fef5b6ea6b128cbb2eb0a3  $src" \
            | sha256sum --check --strict
          mkdir -p apps/wmr_companion_app/android/app/src/main/jniLibs/arm64-v8a
          cp "$src" apps/wmr_companion_app/android/app/src/main/jniLibs/arm64-v8a/libglasses.so

      # The export is a 272 MB release asset on a stable tag, never a file in
      # the repository or in this branch's history.
      - name: Download the approved Unity export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unity-export"
          gh release download "$UNITY_EXPORT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern unityLibrary.zip \
            --dir "$RUNNER_TEMP/unity-export"
          echo "$UNITY_EXPORT_SHA256  $RUNNER_TEMP/unity-export/unityLibrary.zip" \
            | sha256sum --check --strict

      - name: Check the export carries both vendors and the VITURE stereo path
        working-directory: apps/wmr_companion_app
        run: python3 tool/check_unity_export.py "$RUNNER_TEMP/unity-export/unityLibrary.zip"

      - name: Install the export as the unified unityLibrary
        working-directory: apps/wmr_companion_app
        run: tool/install_unity_export.sh unified "$RUNNER_TEMP/unity-export/unityLibrary.zip"

      - name: Build the unified release APK
        working-directory: apps/wmr_companion_app
        env:
          WMR_RELEASE_STORE_FILE: ../wmr-release.keystore
          WMR_RELEASE_STORE_PASSWORD: ${{ secrets.WMR_RELEASE_STORE_PASSWORD }}
          WMR_RELEASE_KEY_ALIAS: wmr-companion
          WMR_RELEASE_KEY_PASSWORD: ${{ secrets.WMR_RELEASE_KEY_PASSWORD }}
        run: >-
          tool/build_flavor.sh unified --release --split-per-abi
          --target-platform android-arm64

      - name: Check the unified APK carries both vendors and the Monado key
        working-directory: apps/wmr_companion_app
        run: >-
          python3 tool/check_unified_apk.py
          build/app/outputs/flutter-apk/app-arm64-v8a-unified-release.apk
          --require-lib lib/arm64-v8a/libglasses.so

      - uses: actions/upload-artifact@v7
        with:
          name: release-dex-check-apk
          path: apps/wmr_companion_app/build/app/outputs/flutter-apk/app-arm64-v8a-unified-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove the decoded keystore
        if: ${{ always() }}
        run: rm -f apps/wmr_companion_app/android/wmr-release.keystore

      # The self-hosted workspace survives between runs, so the proprietary
      # binary must not be left in the checkout for the next job (or for an
      # accidental commit). The path is also gitignored.
      - name: Remove the staged VITURE SDK
        if: ${{ always() }}
        run: |
          rm -f apps/wmr_companion_app/android/app/src/main/jniLibs/arm64-v8a/libglasses.so
          rmdir -p apps/wmr_companion_app/android/app/src/main/jniLibs/arm64-v8a 2>/dev/null || true
