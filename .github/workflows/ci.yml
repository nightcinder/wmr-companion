name: CI

on:
  push:
    branches: [main]
    # A `v*` tag publishes the signed tester APKs: `release` builds `base`
    # (ONY-493) and `release-unified` builds the both-vendors `unified` flavor
    # (ONY-508). `release-checksums` then writes one SHA256SUMS for both.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # One resolution for the whole workspace; every member is resolved here.
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed apps/wmr_companion_app/lib apps/wmr_companion_app/test packages/wmr_fusion packages/wmr_tracking packages/wmr_tracking_android_xr packages/wmr_tracking_viture packages/wmr_tracking_xreal packages/wmr_core packages/wmr_companion packages/wmr_ble packages/wmr_ws packages/wmr_companion_ui packages/wmr_companion_hid_android example/lib example/test
      - working-directory: apps/wmr_companion_app
        run: flutter analyze
      - working-directory: apps/wmr_companion_app
        run: flutter test
      # Pure-stdlib tests for the APK pre-flight checker: build synthetic binary
      # Android XML and APKs, so no SDK or large artifact is needed.
      - name: APK checker tests
        working-directory: apps/wmr_companion_app
        run: python3 -m unittest -v tool/test_check_unified_apk.py
      # Each package's own test suite includes export_boundary_test.dart, which
      # asserts that its lib/ imports no Riverpod, file plugin or higher layer.
      - name: wmr_core package
        working-directory: packages/wmr_core
        run: |
          dart analyze
          dart test
      - name: wmr_companion package
        working-directory: packages/wmr_companion
        run: |
          dart analyze
          dart test
      - name: wmr_companion_hid_android package
        working-directory: packages/wmr_companion_hid_android
        run: |
          flutter analyze
          flutter test
      - name: wmr_companion_ui package
        working-directory: packages/wmr_companion_ui
        run: |
          flutter analyze
          flutter test
      - name: wmr_ble package
        working-directory: packages/wmr_ble
        run: |
          flutter analyze
          flutter test
      - name: wmr_ws package
        working-directory: packages/wmr_ws
        run: |
          dart analyze
          dart test
      - name: wmr_fusion package
        working-directory: packages/wmr_fusion
        run: |
          dart analyze
          dart test
      - name: wmr_tracking package
        working-directory: packages/wmr_tracking
        run: |
          dart analyze
          dart test

      - name: XR adapter contract harness
        working-directory: packages/wmr_tracking
        run: dart run tool/xr_contract_harness.dart

      - name: wmr_tracking_android_xr package
        working-directory: packages/wmr_tracking_android_xr
        run: |
          flutter analyze
          flutter test
      - name: wmr_tracking_viture package
        working-directory: packages/wmr_tracking_viture
        run: |
          flutter analyze
          flutter test
      - name: wmr_tracking_xreal package
        working-directory: packages/wmr_tracking_xreal
        run: |
          flutter analyze
          flutter test
      - name: pub.dev publish dry-run (every package in the publish set)
        run: |
          # A clean dry-run for all twelve published packages. The root pub
          # workspace resolves each hosted inter-package constraint to the
          # local member directory, so nothing has to be on pub.dev yet.
          # A dry-run error or warning fails this step; nothing is uploaded.
          set -eu
          echo "=== Publish dry-run: wmr_fusion ==="
          (cd packages/wmr_fusion && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking ==="
          (cd packages/wmr_tracking && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking_dispatch ==="
          (cd packages/wmr_tracking_dispatch && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking_android_xr ==="
          (cd packages/wmr_tracking_android_xr && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking_viture ==="
          (cd packages/wmr_tracking_viture && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking_xreal ==="
          (cd packages/wmr_tracking_xreal && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_core ==="
          (cd packages/wmr_core && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_companion ==="
          (cd packages/wmr_companion && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_ble ==="
          (cd packages/wmr_ble && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_ws ==="
          (cd packages/wmr_ws && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_companion_ui ==="
          (cd packages/wmr_companion_ui && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_companion_hid_android ==="
          (cd packages/wmr_companion_hid_android && flutter pub publish --dry-run)

      - name: A fresh app consumes the packages
        run: ./tool/fresh_app_check.sh

      - name: Example app
        working-directory: example
        run: |
          flutter analyze
          flutter test
          flutter build apk --debug

  gate7-clock-replay:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # Gate 7 without hardware: a recorded controller capture plus a
      # synthetic head trace through SourceClockAligner. The good fixture must
      # pass; drift, gap and out-of-window must fail with their named reasons.
      - name: Gate 7 clock replay
        working-directory: packages/wmr_tracking
        run: |
          dart run tool/gate7_clock_replay.dart --fixture tool/fixtures/gate7/stable_offset.json
          for f in drift gap out_of_window; do
            code=0
            dart run tool/gate7_clock_replay.dart --fixture "tool/fixtures/gate7/$f.json" || code=$?
            if [ "$code" -ne 1 ]; then
              echo "gate7: $f expected exit 1, got $code" >&2
              exit 1
            fi
          done

  gate8-fallback-quality:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # Gate 8 without hardware: a synthetic nod/walk trace through the
      # headRelative fallback must drift (EXPECTED-FAIL), while a rigid
      # head-local control must stay near zero (PASS).
      - name: Gate 8 fallback quality
        working-directory: packages/wmr_tracking
        run: dart run tool/gate8_fallback_quality.dart

      - uses: actions/upload-artifact@v7
        with:
          name: gate8-fallback-quality
          path: packages/wmr_tracking/build/gate8/fallback_quality.json
          retention-days: 14

  android-flavors:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # Monado's config key (BSL-1.0) is not committed. It is fetched here so the
      # APKs can decode a controller config block; it ends up only inside the
      # artifacts, together with assets/monado/NOTICE.txt. A failed download must
      # not fail CI: the app reports a missing key.
      - name: Fetch Monado config key
        continue-on-error: true
        working-directory: apps/wmr_companion_app
        run: dart run ../../tool/fetch_wmr_config_key.dart

      # Stub unityLibrary modules prove the include path, flavor isolation and
      # the mutual-exclusion guards without Unity or the vendor SDKs. The stubs
      # are removed before the real artifacts are built.
      - name: Unity export installer
        working-directory: apps/wmr_companion_app
        run: tool/test_unity_export_install.sh

      - name: Unity flavor wiring
        working-directory: apps/wmr_companion_app
        run: tool/test_flavor_wiring.sh

      - name: Build base with every Dart flag on
        working-directory: apps/wmr_companion_app
        run: tool/build_flavor.sh base

      - name: Kotlin plugin unit tests
        working-directory: apps/wmr_companion_app/android
        run: |
          ./gradlew --stacktrace \
            :wmr_tracking_dispatch:testDebugUnitTest \
            :wmr_tracking_viture:testDebugUnitTest \
            :wmr_tracking_xreal:testDebugUnitTest \
            :wmr_tracking_android_xr:testDebugUnitTest

      - name: Build viture, xreal and unified without Unity
        working-directory: apps/wmr_companion_app
        run: |
          tool/build_flavor.sh viture
          tool/build_flavor.sh xreal
          tool/build_flavor.sh unified

      - uses: actions/upload-artifact@v7
        with:
          name: wmr-companion-debug-apks
          path: apps/wmr_companion_app/build/app/outputs/flutter-apk/app-*-debug.apk
          retention-days: 14

  gatt-probe:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run GATT probe unit tests
        working-directory: tool/gatt_probe
        run: ./gradlew test --stacktrace

      - name: Build GATT probe APK
        working-directory: tool/gatt_probe
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: wmr-gatt-probe-debug-apk
          path: tool/gatt_probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Test WMRCompanionKit Swift Package
        working-directory: packages/WMRCompanionKit
        run: swift test

      - name: Build WMRCompanionProbe
        working-directory: tool/ios_probe
        run: swift build

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Validate Flutter iOS config
        working-directory: apps/wmr_companion_app
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign

      - name: Validate example iOS config
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign

  # A `v*` tag is the whole input: the release keystore comes from repository
  # secrets, the app is built as the `base` flavor with every Dart adapter
  # compiled in, and the per-ABI APKs plus their SHA-256 sums are attached to
  # that tag's GitHub Release so a tester downloads them without building
  # (ONY-493). No store upload.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      # The ancestry guard below compares the tagged commit with origin/main;
      # the default depth-1 checkout has no history to compare against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A tag can point at any commit, including one that will never reach
      # main. Publishing that would hand a tester an APK main never had, so
      # refuse before spending 40 minutes on a build.
      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $VERSION points at $GITHUB_SHA, which is not an ancestor of origin/main; refusing to publish a release."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # Same optional download as `android-flavors`: a missing key only means
      # the app reports an absent controller config block.
      - name: Fetch Monado config key
        continue-on-error: true
        working-directory: apps/wmr_companion_app
        run: dart run ../../tool/fetch_wmr_config_key.dart

      # The keystore is never committed; it travels base64-encoded in the
      # repository secret. `*.keystore` is gitignored, and the key is removed
      # from the workspace at the end of the job.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WMR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::WMR_RELEASE_KEYSTORE_BASE64 is not set; nothing can be signed."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > apps/wmr_companion_app/android/wmr-release.keystore

      - name: Build signed base APKs
        working-directory: apps/wmr_companion_app
        env:
          # `file(...)` resolves this from android/app, so it lands on the key
          # decoded above at android/wmr-release.keystore.
          WMR_RELEASE_STORE_FILE: ../wmr-release.keystore
          WMR_RELEASE_STORE_PASSWORD: ${{ secrets.WMR_RELEASE_STORE_PASSWORD }}
          WMR_RELEASE_KEY_ALIAS: wmr-companion
          WMR_RELEASE_KEY_PASSWORD: ${{ secrets.WMR_RELEASE_KEY_PASSWORD }}
        run: tool/build_flavor.sh base --release --split-per-abi

      - name: Verify every APK is signed with the project key
        working-directory: apps/wmr_companion_app
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          out="$RUNNER_TEMP/release-assets"
          mkdir -p "$out"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-base-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::--split-per-abi produced no app-*-base-release.apk"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$certs"
            # A debug-signed APK is the regression docs/RELEASE_SIGNING.md forbids.
            if grep -q 'CN=Android Debug' <<<"$certs"; then
              echo "::error::$apk is signed with the Android debug key"
              exit 1
            fi
            if ! grep -q 'CN=WMR Companion' <<<"$certs"; then
              echo "::error::$apk has no CN=WMR Companion signer"
              exit 1
            fi
            if ! grep -qi 'bdaa32b51ad3afd267d0f80f28a473b85319f8c37e26289cf1dc1ff7cfaae256' <<<"$certs"; then
              echo "::error::$apk certificate SHA-256 does not match the documented key"
              exit 1
            fi
            name="${apk##*/}"
            abi="${name#app-}"
            abi="${abi%-base-release.apk}"
            cp "$apk" "$out/wmr-companion-${VERSION#v}-base-$abi.apk"
          done
          (cd "$out" && sha256sum ./*.apk | sed 's| \./| |' > SHA256SUMS)
          ls -l "$out"
          cat "$out/SHA256SUMS"

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a plain vX.Y.Z tag is a production release. Any other shape
          # (a scratch tag, v0.3.0-rc1) publishes as a prerelease so it can
          # never look like the shipped tester build.
          prerelease_args=()
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease_args+=(--prerelease)
            echo "$VERSION is not vX.Y.Z; publishing as a prerelease."
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              "${prerelease_args[@]}" \
              --title "$VERSION" \
              --notes "Signed WMR Companion tester APKs, built by CI from ${GITHUB_SHA}. Download the APK matching your device ABI; SHA256SUMS lists their digests."
            # `release-unified` creates the same release in parallel; losing
            # that race is fine, the release exists either way.
            gh release create "$VERSION" \
              "${prerelease_args[@]}" \
              --title "$VERSION" \
              --notes "Signed WMR Companion tester APKs, built by CI from ${GITHUB_SHA}. Download the APK matching your device ABI; SHA256SUMS lists their digests." \
              || gh release view "$VERSION" >/dev/null
          fi
          gh release upload "$VERSION" "$RUNNER_TEMP"/release-assets/* --clobber
          gh release view "$VERSION" --json assets --jq '.assets[].name'

      - name: Remove the decoded keystore
        if: ${{ always() }}
        run: rm -f apps/wmr_companion_app/android/wmr-release.keystore

  release-unified:
    # The unified flavor links one shared unityLibrary that carries both VITURE
    # 0.9.0 and XREAL 3.1.0, selected at runtime (ONY-508). Unity only produces
    # that export once, on a workstation; CI downloads the approved zip and
    # builds the APKs with Gradle like any other flavor.
    #
    # Same gate as `release`: a `v*` tag whose commit is already on main.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # The export is 272 MB and the per-ABI release APKs are hundreds of MB, so
    # this build is slower than `release`.
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      UNITY_EXPORT_TAG: unity-export-1.0
      # ONY-354's approved export. A different digest is not the artifact the
      # owner approved, so the job refuses to build from it.
      UNITY_EXPORT_SHA256: 945bd4254310766313fac81d0daa472408223c82cbee55186bcbcf3d144333b5
    steps:
      # The ancestry guard below compares the tagged commit with origin/main;
      # the default depth-1 checkout has no history to compare against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $VERSION points at $GITHUB_SHA, which is not an ancestor of origin/main; refusing to publish a release."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # Same optional download as `android-flavors`: a missing key only means
      # the app reports an absent controller config block.
      - name: Fetch Monado config key
        continue-on-error: true
        working-directory: apps/wmr_companion_app
        run: dart run ../../tool/fetch_wmr_config_key.dart

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WMR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::WMR_RELEASE_KEYSTORE_BASE64 is not set; nothing can be signed."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > apps/wmr_companion_app/android/wmr-release.keystore

      # The export is a 272 MB release asset on a stable tag, never a file in
      # the repository or in this branch's history.
      - name: Download the approved Unity export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unity-export"
          gh release download "$UNITY_EXPORT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern unityLibrary.zip \
            --dir "$RUNNER_TEMP/unity-export"
          echo "$UNITY_EXPORT_SHA256  $RUNNER_TEMP/unity-export/unityLibrary.zip" \
            | sha256sum --check --strict

      - name: Install the export as the unified unityLibrary
        working-directory: apps/wmr_companion_app
        run: tool/install_unity_export.sh unified "$RUNNER_TEMP/unity-export/unityLibrary.zip"

      - name: Build signed unified APKs
        working-directory: apps/wmr_companion_app
        env:
          WMR_RELEASE_STORE_FILE: ../wmr-release.keystore
          WMR_RELEASE_STORE_PASSWORD: ${{ secrets.WMR_RELEASE_STORE_PASSWORD }}
          WMR_RELEASE_KEY_ALIAS: wmr-companion
          WMR_RELEASE_KEY_PASSWORD: ${{ secrets.WMR_RELEASE_KEY_PASSWORD }}
        run: tool/build_flavor.sh unified --release --split-per-abi

      # The pre-flight checker proves both Unity runtimes and their hand
      # tracking libraries are in the APK. The export ships arm64-v8a natives
      # only, so that is the split the checker applies to.
      - name: Check the unified APK carries both vendors
        working-directory: apps/wmr_companion_app
        run: |
          set -euo pipefail
          python3 tool/check_unified_apk.py \
            build/app/outputs/flutter-apk/app-arm64-v8a-unified-release.apk

      - name: Verify every APK is signed with the project key
        working-directory: apps/wmr_companion_app
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          out="$RUNNER_TEMP/release-assets"
          mkdir -p "$out"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-unified-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::--split-per-abi produced no app-*-unified-release.apk"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$certs"
            if grep -q 'CN=Android Debug' <<<"$certs"; then
              echo "::error::$apk is signed with the Android debug key"
              exit 1
            fi
            if ! grep -q 'CN=WMR Companion' <<<"$certs"; then
              echo "::error::$apk has no CN=WMR Companion signer"
              exit 1
            fi
            if ! grep -qi 'bdaa32b51ad3afd267d0f80f28a473b85319f8c37e26289cf1dc1ff7cfaae256' <<<"$certs"; then
              echo "::error::$apk certificate SHA-256 does not match the documented key"
              exit 1
            fi
            name="${apk##*/}"
            abi="${name#app-}"
            abi="${abi%-unified-release.apk}"
            cp "$apk" "$out/wmr-companion-${VERSION#v}-unified-$abi.apk"
          done
          ls -l "$out"

      # SHA256SUMS is recomputed by `release-checksums` once both flavors have
      # uploaded; this job only adds its APKs.
      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease_args+=(--prerelease)
            echo "$VERSION is not vX.Y.Z; publishing as a prerelease."
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              "${prerelease_args[@]}" \
              --title "$VERSION" \
              --notes "Signed WMR Companion tester APKs, built by CI from ${GITHUB_SHA}. Download the APK matching your device; SHA256SUMS lists their digests. Use the unified APK for VITURE or XREAL glasses, base for Android XR." \
              || gh release view "$VERSION" >/dev/null
          fi
          gh release upload "$VERSION" "$RUNNER_TEMP"/release-assets/*.apk --clobber
          gh release view "$VERSION" --json assets --jq '.assets[].name'

      - name: Remove the decoded keystore
        if: ${{ always() }}
        run: rm -f apps/wmr_companion_app/android/wmr-release.keystore

  release-checksums:
    # `release` and `release-unified` run in parallel and each would overwrite
    # the other's SHA256SUMS. Once both have uploaded, recompute one file that
    # covers every APK on the release.
    needs: [release, release-unified]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success' && needs['release-unified'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Recompute SHA256SUMS from every published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-assets"
          mkdir -p "$out"
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'wmr-companion-*.apk' \
            --dir "$out"
          (cd "$out" && sha256sum ./*.apk | sed 's| \./| |' > SHA256SUMS)
          cat "$out/SHA256SUMS"
          gh release upload "$VERSION" "$out/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
