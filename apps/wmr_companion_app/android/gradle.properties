org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=true
# settings.gradle.kts probes android/unity/<flavor>/unityLibrary at configuration
# time (ONY-271, ONY-355). A directory appearing or disappearing between builds is
# not a configuration-cache input, so a cached configuration would silently link
# the wrong Unity module (or none). Keep the cache off so every build re-probes.
org.gradle.configuration-cache=false
# Reuse task outputs between CI runs (AGP resource/dex/jar tasks and the Kotlin
# plugin modules). This is the build cache, not the configuration cache: task
# inputs are what it keys on, so it does not have the configuration-cache
# problem described above. Flutter's own assemble task is not cacheable
# (`compileFlutterBuildDebug` is not a @CacheableTask), so a Dart-only change
# still recompiles the kernel; the win is the Android-side work around it.
org.gradle.caching=true
