org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# settings.gradle.kts probes android/unity/<flavor>/unityLibrary at configuration
# time (ONY-271, ONY-355). A directory appearing or disappearing between builds is
# not a configuration-cache input, so a cached configuration would silently link
# the wrong Unity module (or none). Keep the cache off so every build re-probes.
org.gradle.configuration-cache=false
