publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  wmr_companion:
    path: ../packages/wmr_companion
  wmr_ble:
    path: ../packages/wmr_ble

dependency_overrides:
  wmr_core:
    path: ../packages/wmr_core
  wmr_fusion:
    path: ../packages/wmr_fusion
  wmr_ble:
    path: ../packages/wmr_ble
  wmr_companion:
    path: ../packages/wmr_companion
  wmr_companion_ui:
    path: ../packages/wmr_companion_ui
  wmr_companion_hid_android:
    path: ../packages/wmr_companion_hid_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
