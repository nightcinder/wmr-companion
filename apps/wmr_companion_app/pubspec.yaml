name: wmr_companion_app
description: "Companion app for the ESP32 WMR Bridge."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  vector_math: ^2.4.3
  wmr_core: ^0.1.0
  wmr_ble: ^0.1.0
  wmr_ws: ^0.1.0
  wmr_companion: ^0.1.0
  wmr_companion_ui: ^0.1.0
  wmr_companion_hid_android: ^0.1.0
  wmr_fusion: ^0.1.0
  wmr_tracking: ^0.1.0
  wmr_tracking_android_xr: ^0.1.0
  wmr_tracking_viture: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    # Holds only .gitkeep in git; tool/fetch_wmr_config_key.dart adds the key.
    - assets/monado/
