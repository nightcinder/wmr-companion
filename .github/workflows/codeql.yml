name: codeql

on:
  # Same split as ci.yml and security.yml: branch pushes stay on `main`, so a
  # PR gets one `pull_request` run rather than a second push run beside it.
  push:
    branches: [main]
  pull_request:
  # The query packs move under us; a weekly full scan catches what a diff-only
  # run does not re-examine.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Job-level permissions replace the workflow-level set, so every scope
      # the job needs is listed here.
      contents: read
      actions: read
      security-events: write
    strategy:
      # One slow language must not cancel the others.
      fail-fast: false
      matrix:
        include:
          # Dart is not a CodeQL language, so the app's own logic is out of
          # reach. These three cover the native shells and the tooling around
          # them, which is what is left. `build-mode: none` analyses sources
          # directly and avoids an Android/Gradle autobuild that would fail on
          # the Flutter toolchain.
          - language: java-kotlin
            build-mode: none
          - language: csharp
            build-mode: none
          - language: python
            build-mode: none
          # Swift is deliberately absent: CodeQL only analyses it on macOS
          # runners, and the iOS job is already the expensive one.
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
