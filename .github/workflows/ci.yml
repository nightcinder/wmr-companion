name: CI

on:
  push:
    branches: [main]
    # A `v*` tag publishes the signed tester APKs: `release-unified` builds the
    # both-vendors `unified` flavor (ONY-508, ONY-520) and
    # `release-checksums` writes one SHA256SUMS for it.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter for the expensive Android jobs. The gate jobs below depend on
  # it, so a docs-only PR still reports every required context while skipping
  # the APK and GATT-probe builds. A push to main always builds (see the
  # `-build` jobs), so main can never miss a regression the filter hides.
  changes:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android_flavors: ${{ steps.filter.outputs.android_flavors }}
      gatt_probe: ${{ steps.filter.outputs.gatt_probe }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android_flavors:
              - 'apps/**'
              - '.github/actions/**'
              - 'packages/**'
              - 'example/**'
              - 'tool/fetch_wmr_config_key.dart'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/ci.yml'
            gatt_probe:
              - 'tool/gatt_probe/**'
              - '.github/workflows/ci.yml'

  build:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: ./.github/actions/flutter-setup
        id: flutter

      # One resolution for the whole workspace; every member is resolved here.
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed apps/wmr_companion_app/lib apps/wmr_companion_app/test packages/wmr_fusion packages/wmr_tracking packages/wmr_tracking_android_xr packages/wmr_tracking_viture packages/wmr_tracking_xreal packages/wmr_core packages/wmr_companion packages/wmr_ble packages/wmr_ws packages/wmr_companion_ui packages/wmr_companion_hid_android example/lib example/test
      - working-directory: apps/wmr_companion_app
        run: flutter analyze
      - working-directory: apps/wmr_companion_app
        run: flutter test
      # Pure-stdlib tests for the APK pre-flight checker: build synthetic binary
      # Android XML and APKs, so no SDK or large artifact is needed.
      - name: APK checker tests
        working-directory: apps/wmr_companion_app
        run: python3 -m unittest -v tool/test_check_unified_apk.py
      # Same for the export checker: synthetic unityLibrary zips, no 272 MB
      # artifact and no Unity install.
      - name: Unity export checker tests
        working-directory: apps/wmr_companion_app
        run: python3 -m unittest -v tool/test_check_unity_export.py
      # Each package's own test suite includes export_boundary_test.dart, which
      # asserts that its lib/ imports no Riverpod, file plugin or higher layer.
      - name: wmr_core package
        working-directory: packages/wmr_core
        run: |
          dart analyze
          dart test
      - name: wmr_companion package
        working-directory: packages/wmr_companion
        run: |
          dart analyze
          dart test
      - name: wmr_companion_hid_android package
        working-directory: packages/wmr_companion_hid_android
        run: |
          flutter analyze
          flutter test
      - name: wmr_companion_ui package
        working-directory: packages/wmr_companion_ui
        run: |
          flutter analyze
          flutter test
      - name: wmr_ble package
        working-directory: packages/wmr_ble
        run: |
          flutter analyze
          flutter test
      - name: wmr_ws package
        working-directory: packages/wmr_ws
        run: |
          dart analyze
          dart test
      - name: wmr_fusion package
        working-directory: packages/wmr_fusion
        run: |
          dart analyze
          dart test
      - name: wmr_tracking package
        working-directory: packages/wmr_tracking
        run: |
          dart analyze
          dart test

      - name: XR adapter contract harness
        working-directory: packages/wmr_tracking
        run: dart run tool/xr_contract_harness.dart

      - name: wmr_tracking_android_xr package
        working-directory: packages/wmr_tracking_android_xr
        run: |
          flutter analyze
          flutter test
      - name: wmr_tracking_viture package
        working-directory: packages/wmr_tracking_viture
        run: |
          flutter analyze
          flutter test
      - name: wmr_tracking_xreal package
        working-directory: packages/wmr_tracking_xreal
        run: |
          flutter analyze
          flutter test
      - name: pub.dev publish dry-run (every package in the publish set)
        run: |
          # A clean dry-run for all twelve published packages. The root pub
          # workspace resolves each hosted inter-package constraint to the
          # local member directory, so nothing has to be on pub.dev yet.
          # A dry-run error or warning fails this step; nothing is uploaded.
          set -eu
          echo "=== Publish dry-run: wmr_fusion ==="
          (cd packages/wmr_fusion && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking ==="
          (cd packages/wmr_tracking && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking_dispatch ==="
          (cd packages/wmr_tracking_dispatch && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking_android_xr ==="
          (cd packages/wmr_tracking_android_xr && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking_viture ==="
          (cd packages/wmr_tracking_viture && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_tracking_xreal ==="
          (cd packages/wmr_tracking_xreal && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_core ==="
          (cd packages/wmr_core && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_companion ==="
          (cd packages/wmr_companion && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_ble ==="
          (cd packages/wmr_ble && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_ws ==="
          (cd packages/wmr_ws && dart pub publish --dry-run)

          echo "=== Publish dry-run: wmr_companion_ui ==="
          (cd packages/wmr_companion_ui && flutter pub publish --dry-run)

          echo "=== Publish dry-run: wmr_companion_hid_android ==="
          (cd packages/wmr_companion_hid_android && flutter pub publish --dry-run)

      - name: A fresh app consumes the packages
        run: ./tool/fresh_app_check.sh

      - name: Example app
        working-directory: example
        run: |
          flutter analyze
          flutter test

      - name: Save the Flutter caches
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/flutter-cache-save
        with:
          save-sdk: ${{ steps.flutter.outputs.sdk-cache-hit != 'true' }}
          save-pub: ${{ steps.flutter.outputs.pub-cache-hit != 'true' }}

  gate7-clock-replay:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-setup

      - run: flutter pub get

      # Gate 7 without hardware: a recorded controller capture plus a
      # synthetic head trace through SourceClockAligner. The good fixture must
      # pass; drift, gap and out-of-window must fail with their named reasons.
      - name: Gate 7 clock replay
        working-directory: packages/wmr_tracking
        run: |
          dart run tool/gate7_clock_replay.dart --fixture tool/fixtures/gate7/stable_offset.json
          for f in drift gap out_of_window; do
            code=0
            dart run tool/gate7_clock_replay.dart --fixture "tool/fixtures/gate7/$f.json" || code=$?
            if [ "$code" -ne 1 ]; then
              echo "gate7: $f expected exit 1, got $code" >&2
              exit 1
            fi
          done

  gate8-fallback-quality:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-setup

      - run: flutter pub get

      # Gate 8 without hardware: a synthetic nod/walk trace through the
      # headRelative fallback must drift (EXPECTED-FAIL), while a rigid
      # head-local control must stay near zero (PASS).
      - name: Gate 8 fallback quality
        working-directory: packages/wmr_tracking
        run: dart run tool/gate8_fallback_quality.dart

      - uses: actions/upload-artifact@v7
        with:
          name: gate8-fallback-quality
          path: packages/wmr_tracking/build/gate8/fallback_quality.json
          retention-days: 14

  android-flavors:
    # Required context. Reports green only when the path filter ran and the
    # build succeeded or was skipped by that filter; it never reports green
    # while `changes` failed or was cancelled.
    needs: [changes, android-flavors-build]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on the path filter and the Android build
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.android-flavors-build.result }}
        run: |
          set -eu
          echo "changes: $CHANGES"
          echo "android-flavors-build: $BUILD"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes did not succeed ($CHANGES); refusing to report android-flavors green."
            exit 1
          fi
          case "$BUILD" in
            success|skipped) ;;
            *)
              echo "::error::android-flavors-build did not succeed ($BUILD)."
              exit 1
              ;;
          esac

  android-flavors-build:
    needs: changes
    # A push to main always builds, whatever the path filter says; PRs build
    # only when Android-relevant paths changed.
    if: ${{ (needs.changes.outputs.android_flavors == 'true' || github.ref == 'refs/heads/main') && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # `actions: read` lets the miss check below list the repository's cache
    # entries with the job token.
    permissions:
      contents: read
      actions: read
    env:
      # Pinned in the app's `ndkVersion`: package:jni (a path_provider_android
      # dependency) compiles C++ through CMake, so these downloads are real.
      ANDROID_NDK_VERSION: 28.2.13676358
      ANDROID_CMAKE_VERSION: 3.22.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Only the pinned NDK/CMake versions are cached, and only a push to main
      # writes the entry (ONY-540): the old cache saved per ref, so a pull
      # request or a tag stored a second 2.7 GB copy that evicted this one
      # between runs.
      - name: Restore the Android NDK and CMake
        id: android-tools
        uses: actions/cache/restore@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-ndk-cmake-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}
          restore-keys: |
            android-ndk-cmake-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-

      # An expected miss downloads and, on main, saves; on main a miss while the
      # exact key already exists means the entry is unreachable (evicted, or
      # the path-derived version changed) and would silently stay that way.
      # The first main run after this lands has no entry yet, so it passes here
      # and seeds one. Pull requests only report the miss. The lookup is scoped
      # to `refs/heads/main` because that is the only ref a restore reads, and
      # it fails closed: an unreadable cache list cannot tell a first seed from
      # an evicted entry, so it must not pass silently.
      - name: Check the Android NDK cache state
        if: ${{ steps.android-tools.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: android-ndk-cmake-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -uo pipefail
          echo "NDK/CMake cache miss on $GITHUB_REF: the build will download them."
          [ "$ON_MAIN" = "true" ] || exit 0
          if ! keys=$(gh cache list --ref refs/heads/main --key "$CACHE_KEY" --limit 100 --json key --jq '.[].key'); then
            echo "::error::Could not list the cache entries for $CACHE_KEY; cannot tell a first seed from an evicted entry."
            exit 1
          fi
          if grep -qxF "$CACHE_KEY" <<<"$keys"; then
            echo "::error::A cache entry for $CACHE_KEY exists under refs/heads/main but the restore missed; the entry is unreachable and the build re-downloads every run."
            exit 1
          fi
          echo "No entry for $CACHE_KEY under refs/heads/main yet: this run seeds it."

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/flutter-setup

      - run: flutter pub get

      # Monado's config key (BSL-1.0) is not committed. It is fetched here so the
      # APKs can decode a controller config block; it ends up only inside the
      # artifacts, together with assets/monado/NOTICE.txt. A failed download must
      # not fail CI: the app reports a missing key.
      - name: Fetch Monado config key
        continue-on-error: true
        working-directory: apps/wmr_companion_app
        run: dart run ../../tool/fetch_wmr_config_key.dart

      # A stub unityLibrary module proves the unified include path without Unity
      # or the vendor SDKs. The stub is removed before the real artifact is
      # built.
      - name: Unity export installer
        working-directory: apps/wmr_companion_app
        run: tool/test_unity_export_install.sh

      - name: Unity flavor wiring
        working-directory: apps/wmr_companion_app
        run: tool/test_flavor_wiring.sh

      - name: Kotlin plugin unit tests
        working-directory: apps/wmr_companion_app/android
        run: |
          ./gradlew --stacktrace \
            :wmr_tracking_dispatch:testDebugUnitTest \
            :wmr_tracking_viture:testDebugUnitTest \
            :wmr_tracking_xreal:testDebugUnitTest \
            :wmr_tracking_android_xr:testDebugUnitTest

      - name: Build unified without Unity
        working-directory: apps/wmr_companion_app
        run: tool/build_flavor.sh unified

      # Moved out of `build`: the example APK needs the Android SDK and Gradle,
      # which only this job pays for.
      - name: Example app APK
        working-directory: example
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: wmr-companion-debug-apks
          path: apps/wmr_companion_app/build/app/outputs/flutter-apk/app-*-debug.apk
          retention-days: 14

      # Written only from main, after the build proved the download works.
      - name: Save the Android NDK and CMake
        if: ${{ github.ref == 'refs/heads/main' && steps.android-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-ndk-cmake-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}

  gatt-probe:
    # Required context. Same contract as android-flavors: green only when the
    # path filter ran and the probe build succeeded or was skipped by it.
    needs: [changes, gatt-probe-build]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on the path filter and the GATT probe build
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.gatt-probe-build.result }}
        run: |
          set -eu
          echo "changes: $CHANGES"
          echo "gatt-probe-build: $BUILD"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes did not succeed ($CHANGES); refusing to report gatt-probe green."
            exit 1
          fi
          case "$BUILD" in
            success|skipped) ;;
            *)
              echo "::error::gatt-probe-build did not succeed ($BUILD)."
              exit 1
              ;;
          esac

  gatt-probe-build:
    needs: changes
    # A push to main always builds, whatever the path filter says; PRs build
    # only when the probe changed.
    if: ${{ (needs.changes.outputs.gatt_probe == 'true' || github.ref == 'refs/heads/main') && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run GATT probe unit tests
        working-directory: tool/gatt_probe
        run: ./gradlew test --stacktrace

      - name: Build GATT probe APK
        working-directory: tool/gatt_probe
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: wmr-gatt-probe-debug-apk
          path: tool/gatt_probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    # Tag pushes build only the release job; these gates run on branches/PRs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Test WMRCompanionKit Swift Package
        working-directory: packages/WMRCompanionKit
        run: swift test

      - name: Build WMRCompanionProbe
        working-directory: tool/ios_probe
        run: swift build

      # The macOS SDK entry is 2.2 GB and only this job reads it; keeping it
      # would leave less than a gigabyte of the 7 GB target for the NDK entry,
      # so the iOS job downloads the SDK instead. The pub cache is tiny and
      # still restored.
      - uses: ./.github/actions/flutter-setup
        id: flutter
        with:
          sdk-cache: 'false'

      - name: Validate Flutter iOS config
        working-directory: apps/wmr_companion_app
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign

      - name: Validate example iOS config
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign

      # This job is the only reader of the macOS pub key, so it is also the
      # only writer: without this step a `pubspec.lock` change left the key
      # missing on every run and the restore never converged. Only the pub
      # cache is written; the 2.2 GB SDK entry stays uncached.
      - name: Save the macOS pub cache
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/flutter-cache-save
        with:
          save-sdk: 'false'
          save-pub: ${{ steps.flutter.outputs.pub-cache-hit != 'true' }}

  release-unified:
    # The unified flavor links one shared unityLibrary that carries both VITURE
    # 0.9.0 and XREAL 3.1.0, selected at runtime (ONY-508). Unity only produces
    # that export once, on a workstation; CI downloads the approved zip and
    # builds the APKs with Gradle like any other flavor.
    #
    # Only a `v*` tag whose commit is already on main publishes.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: [self-hosted, liesa, android]
    # The export is 272 MB and the arm64-v8a release APK is hundreds of MB.
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      # ONY-613's replacement export, built from the ONY-612 merge commit
      # 71e4c815. It is a prerelease on purpose: the export is not an app
      # release and must never take the repository's "Latest release" flag.
      UNITY_EXPORT_TAG: unity-export-1.1
      # `install_unity_export.sh` pins the export's `ndkVersion` at this value.
      ANDROID_NDK_VERSION: 28.2.13676358
      ANDROID_CMAKE_VERSION: 3.22.1
      # ONY-613's approved export. A different digest is not the artifact the
      # owner approved, so the job refuses to build from it.
      UNITY_EXPORT_SHA256: 29a9b9066d1b8dcee7b7acf5dddf7075dbd987c6dcbf29fde9216ed7084d2072
    steps:
      # The ancestry guard below compares the tagged commit with origin/main;
      # the default depth-1 checkout has no history to compare against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $VERSION points at $GITHUB_SHA, which is not an ancestor of origin/main; refusing to publish a release."
            exit 1
          fi

      # `liesa` is a plain host, not the GitHub-hosted image: it exports no
      # ANDROID_HOME and carries only the tools its owner installed. Fail here,
      # before the 120-minute build, naming exactly what is missing instead of
      # letting a later step crash halfway through.
      - name: Preflight the self-hosted runner
        run: |
          set -euo pipefail
          missing=()
          # `unzip` is what `tool/install_unity_export.sh` uses to read the
          # 272 MB export, so it has to be named here too: without it the
          # preflight would pass and the job would die right after the download.
          for tool in gh python3 git base64 sha256sum unzip; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::liesa is missing ${missing[*]}; add them to the runner image. This job does not apt-install."
            exit 1
          fi

      - name: Locate the Android SDK
        id: android-sdk
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            for candidate in "$HOME/Android/Sdk" /usr/local/lib/android/sdk /opt/android-sdk /opt/android/sdk; do
              if [ -d "$candidate" ]; then sdk="$candidate"; break; fi
            done
          fi
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::No Android SDK on liesa: ANDROID_HOME/ANDROID_SDK_ROOT are unset and no SDK sits in the usual places. Install one on the runner image."
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "Android SDK: $sdk"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The declared pins are installed explicitly: this runner does not carry
      # the GitHub-hosted image, and the Actions cache is no substitute — it
      # archives absolute paths, so an entry saved on a hosted runner would not
      # land in this host's SDK. A matching preinstalled NDK/CMake is reused,
      # and the first tag run pays the download once (it persists on the host).
      - name: Install the pinned NDK and CMake
        run: |
          # Not `pipefail`: `yes` exits with SIGPIPE once sdkmanager stops
          # reading its licence prompts, which is not a failure here.
          set -eu
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cmake="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          if [ ! -d "$ndk" ] || [ ! -d "$cmake" ]; then
            sdkmanager="$(command -v sdkmanager || true)"
            if [ -z "$sdkmanager" ]; then
              sdkmanager="$(find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager | head -n 1 || true)"
            fi
            if [ -z "$sdkmanager" ]; then
              echo "::error::sdkmanager not found under $ANDROID_HOME; cannot install ndk;$ANDROID_NDK_VERSION and cmake;$ANDROID_CMAKE_VERSION."
              exit 1
            fi
            [ -d "$ndk" ] || yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;$ANDROID_NDK_VERSION"
            [ -d "$cmake" ] || yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" "cmake;$ANDROID_CMAKE_VERSION"
          fi
          test -d "$ndk"
          test -d "$cmake"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "NDK: $ndk"
          echo "CMake: $cmake"

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/flutter-setup

      - run: flutter pub get

      # Monado's config key (BSL-1.0) is not committed, but the published APK
      # must carry it, so a failed download, a wrong size, or a header that is
      # not the pinned one fails the job. The URL is pinned to the last monado
      # commit that touched the file, and the SHA-256 covers the extracted key.
      - name: Fetch Monado config key
        working-directory: apps/wmr_companion_app
        run: |
          set -euo pipefail
          dart run ../../tool/fetch_wmr_config_key.dart \
            --url https://gitlab.freedesktop.org/monado/monado/-/raw/01c6e4ed28dc6e85b84d4683831947862a64844c/src/xrt/drivers/wmr/wmr_config_key.h
          test "$(stat -c%s assets/monado/wmr_config_key.bin)" = "1024"
          echo "f0fbc70a916dbe0b87e9162ddee6b9fd768696354d9cd3cd0e7f9ddd90f6f1dc  assets/monado/wmr_config_key.bin" \
            | sha256sum --check --strict

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WMR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::WMR_RELEASE_KEYSTORE_BASE64 is not set; nothing can be signed."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > apps/wmr_companion_app/android/wmr-release.keystore

      # The export is a 272 MB release asset on a stable tag, never a file in
      # the repository or in this branch's history.
      - name: Download the approved Unity export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unity-export"
          gh release download "$UNITY_EXPORT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern unityLibrary.zip \
            --dir "$RUNNER_TEMP/unity-export"
          echo "$UNITY_EXPORT_SHA256  $RUNNER_TEMP/unity-export/unityLibrary.zip" \
            | sha256sum --check --strict

      # The digest only proves the bytes match the pin. This proves the content
      # is the ONY-613 export: both vendor runtimes, and the ONY-612 stereo rig
      # with playerHosted/loaderStarted/firstFrame and no `mono` mode. A stale
      # unity-export-1.0 or a mono export fails here, before the 120-minute
      # build rather than in the published APK.
      - name: Check the export carries both vendors and the VITURE stereo path
        working-directory: apps/wmr_companion_app
        run: python3 tool/check_unity_export.py "$RUNNER_TEMP/unity-export/unityLibrary.zip"

      - name: Install the export as the unified unityLibrary
        working-directory: apps/wmr_companion_app
        run: tool/install_unity_export.sh unified "$RUNNER_TEMP/unity-export/unityLibrary.zip"

      - name: Build signed unified APKs
        working-directory: apps/wmr_companion_app
        env:
          WMR_RELEASE_STORE_FILE: ../wmr-release.keystore
          WMR_RELEASE_STORE_PASSWORD: ${{ secrets.WMR_RELEASE_STORE_PASSWORD }}
          WMR_RELEASE_KEY_ALIAS: wmr-companion
          WMR_RELEASE_KEY_PASSWORD: ${{ secrets.WMR_RELEASE_KEY_PASSWORD }}
        # The export ships arm64-v8a natives only, so a 32-bit or x86_64
        # split would install but carry no Unity runtime at all: VITURE and
        # XREAL would report typed `unavailable` on an artifact labelled
        # unified. Build the one ABI that can actually hold both vendors.
        run: >-
          tool/build_flavor.sh unified --release --split-per-abi
          --target-platform android-arm64

      # Prints the on-disk asset next to the APK's own entry list, so a failure
      # shows whether the key was never packaged or the checker looked in the
      # wrong place. Flutter stores declared pubspec assets under
      # assets/flutter_assets/, not at the bare pubspec path.
      - name: Show where the Monado key landed
        working-directory: apps/wmr_companion_app
        run: |
          set -euo pipefail
          echo "assets/monado on disk:"
          ls -l assets/monado/
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-unified-release.apk
          echo "monado entries in $apk:"
          # Do not require `unzip` on the self-hosted runner.
          if command -v unzip >/dev/null 2>&1; then
            unzip -l "$apk" | grep -i monado || echo "  (none)"
          else
            python3 -m zipfile -l "$apk" | grep -i monado || echo "  (none)"
          fi

      # The pre-flight checker proves both Unity runtimes, their hand tracking
      # libraries and the Monado config key are packaged in the APK.
      - name: Check the unified APK carries both vendors and the Monado key
        working-directory: apps/wmr_companion_app
        run: python3 tool/check_unified_apk.py build/app/outputs/flutter-apk/app-arm64-v8a-unified-release.apk

      - name: Verify every APK is signed with the project key
        working-directory: apps/wmr_companion_app
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          out="$RUNNER_TEMP/release-assets"
          mkdir -p "$out"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-unified-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::--split-per-abi produced no app-*-unified-release.apk"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$certs"
            if grep -q 'CN=Android Debug' <<<"$certs"; then
              echo "::error::$apk is signed with the Android debug key"
              exit 1
            fi
            if ! grep -q 'CN=WMR Companion' <<<"$certs"; then
              echo "::error::$apk has no CN=WMR Companion signer"
              exit 1
            fi
            if ! grep -qi 'bdaa32b51ad3afd267d0f80f28a473b85319f8c37e26289cf1dc1ff7cfaae256' <<<"$certs"; then
              echo "::error::$apk certificate SHA-256 does not match the documented key"
              exit 1
            fi
            name="${apk##*/}"
            abi="${name#app-}"
            abi="${abi%-unified-release.apk}"
            cp "$apk" "$out/wmr-companion-${VERSION#v}-unified-$abi.apk"
          done
          ls -l "$out"

      # SHA256SUMS is recomputed by `release-checksums` after this job uploads
      # its APKs.
      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease_args+=(--prerelease)
            echo "$VERSION is not vX.Y.Z; publishing as a prerelease."
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              "${prerelease_args[@]}" \
              --title "$VERSION" \
              --notes "Signed WMR Companion tester APK for VITURE and XREAL glasses, built by CI from ${GITHUB_SHA}. SHA256SUMS lists its digest. If the phone still has a build made before 0.3.3 (debug or locally signed), uninstall com.onyxlens.wmr_companion once first; Android otherwise stops with \"Something went wrong\"." \
              || gh release view "$VERSION" >/dev/null
          fi
          gh release upload "$VERSION" "$RUNNER_TEMP"/release-assets/*.apk --clobber
          gh release view "$VERSION" --json assets --jq '.assets[].name'

      - name: Remove the decoded keystore
        if: ${{ always() }}
        run: rm -f apps/wmr_companion_app/android/wmr-release.keystore

  release-checksums:
    # `release-unified` uploads the unified APKs; once it has finished, write
    # one SHA256SUMS file that covers every APK on the release. The build job
    # writes no digest of its own.
    needs: [release-unified]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs['release-unified'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Recompute SHA256SUMS from every published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-assets"
          mkdir -p "$out"
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'wmr-companion-*.apk' \
            --dir "$out"
          (cd "$out" && sha256sum ./*.apk | sed 's| \./| |' > SHA256SUMS)
          cat "$out/SHA256SUMS"
          gh release upload "$VERSION" "$out/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
