name: wmr_companion_app
description: "Companion app for the ESP32 WMR Bridge."
publish_to: 'none'
version: 0.3.10+15

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.5.2
  device_info_plus: ^13.3.0
  flutter_riverpod: ^3.4.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  vector_math: ^2.4.3
  wmr_core: ^0.2.2
  wmr_ble: ^0.2.2
  wmr_ws: ^0.2.2
  wmr_companion: ^0.2.2
  wmr_companion_ui: ^0.2.2
  wmr_companion_hid_android: ^0.2.2
  wmr_fusion: ^0.2.2
  wmr_tracking: ^0.2.2
  wmr_tracking_dispatch: ^0.2.2
  wmr_tracking_android_xr: ^0.2.2
  wmr_tracking_viture: ^0.2.2
  wmr_tracking_xreal: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    # Holds only .gitkeep in git; tool/fetch_wmr_config_key.dart adds the key.
    - assets/monado/
    # VITURE C SDK 2.4.1 LICENSE + NOTICE, surfaced on the licence page.
    - assets/notices/
    # The EULA the VITURE SDK agreement requires (2.3.1), shown in-app.
    - assets/legal/
