name: wmr_companion_app
description: "Companion app for the ESP32 WMR Bridge."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  vector_math: ^2.4.3
  wmr_core:
    path: ../../packages/wmr_core
  wmr_ble:
    path: ../../packages/wmr_ble
  wmr_companion:
    path: ../../packages/wmr_companion
  wmr_companion_ui:
    path: ../../packages/wmr_companion_ui
  wmr_companion_hid_android:
    path: ../../packages/wmr_companion_hid_android
  wmr_fusion:
    path: ../../packages/wmr_fusion

dependency_overrides:
  wmr_core:
    path: packages/wmr_core
  wmr_fusion:
    path: packages/wmr_fusion
  wmr_ble:
    path: packages/wmr_ble
  wmr_companion:
    path: packages/wmr_companion
  wmr_companion_ui:
    path: packages/wmr_companion_ui
  wmr_companion_hid_android:
    path: packages/wmr_companion_hid_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    # Holds only .gitkeep in git; tool/fetch_wmr_config_key.dart adds the key.
    - assets/monado/
