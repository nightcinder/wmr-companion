name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: wmr_fusion package
        working-directory: packages/wmr_fusion
        run: |
          dart pub get
          dart analyze
          dart test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: wmr-companion-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
