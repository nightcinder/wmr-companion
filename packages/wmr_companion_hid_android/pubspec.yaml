name: wmr_companion_hid_android
description: Android Bluetooth HID gamepad output for wmr_companion hosts.
version: 0.1.0
repository: https://github.com/nightcinder/wmr-companion
issue_tracker: https://github.com/nightcinder/wmr-companion/issues

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  wmr_companion:
    path: ../wmr_companion

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.onyxlens.wmr_companion_hid_android
        pluginClass: WmrCompanionHidPlugin
