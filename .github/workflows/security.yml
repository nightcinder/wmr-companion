name: security

on:
  # Same split as ci.yml: branch pushes stay on `main`, so a PR gets one
  # `pull_request` run rather than a second push run beside it.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan of the commits a PR adds (and of a push to `main`). The action
  # needs a GITLEAKS_LICENSE only for organisation-owned repositories, so none
  # is needed while the repo belongs to a personal account. Report-only until we
  # have a week of noise data: a finding is visible in the job summary and SARIF
  # artifact but cannot block the merge.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      # Job-level permissions replace the workflow-level set, so both scopes
      # must be listed. `pull-requests: read` lets the action list the PR's
      # commits before scanning; comment writing is disabled below, so the
      # token never needs write access.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks-action scans a commit range; a shallow clone hides the
          # base commit on a push to `main`.
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings live in the job summary and SARIF artifact; inline review
          # comments would need `pull-requests: write`.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Static analysis with two registry configs: the language-agnostic security
  # audit and the generic secret rules. Semgrep's Dart coverage is thin, so
  # this job is mostly a cross-language safety net; gitleaks and Dependabot are
  # the real wins here. `semgrep ci` is deliberately not used because it
  # requires a SEMGREP_APP_TOKEN; `semgrep scan` runs the same rules from the
  # public registry without an account.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      # Job-level permissions replace the workflow-level set: `contents` for
      # the checkout, `security-events` for the SARIF upload below.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep
      - name: Scan
        # semgrep exits non-zero when it reports findings, which is expected
        # while the job is report-only. Keep the SARIF step running so the
        # findings are still published as an artifact.
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30
      # The artifact is a per-run snapshot; code scanning is the record that
      # keeps state across runs and dedupes a finding once it is fixed.
      - name: Publish to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Dependency CVEs for the pub workspace, which keeps one lockfile at the
  # root. That lockfile is the only manifest here osv-scanner can read: the
  # three csproj files under packages/wmr_tracking_unity declare no
  # PackageReference and there is no NuGet or Gradle lockfile. OSV carries the
  # pub.dev advisories that the GitHub Advisory Database does not always
  # mirror, so this is not a duplicate of Dependabot.
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report-only while the repo has no triage history, matching gitleaks and
    # semgrep. A finding fails the step, not the merge.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Install osv-scanner
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner_linux_amd64" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner_SHA256SUMS" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_SHA256SUMS
          (cd "$RUNNER_TEMP" && grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/osv-scanner_linux_amd64"
      - name: Scan dependencies
        run: |
          "$RUNNER_TEMP/osv-scanner_linux_amd64" scan source -r . \
            --format sarif \
            --output osv.sarif
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-sarif
          path: osv.sarif
          if-no-files-found: warn
          retention-days: 30
      - name: Publish to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif
          category: osv-scanner
