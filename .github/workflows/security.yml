name: security

on:
  # Same split as ci.yml: branch pushes stay on `main`, so a PR gets one
  # `pull_request` run rather than a second push run beside it.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan of the commits a PR adds (and of a push to `main`). The action
  # needs a GITLEAKS_LICENSE only for organisation-owned repositories, so none
  # is needed while the repo belongs to a personal account. Report-only until we
  # have a week of noise data: a finding is visible in the job summary and SARIF
  # artifact but cannot block the merge.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      # Job-level permissions replace the workflow-level set, so both scopes
      # must be listed. `pull-requests: read` lets the action list the PR's
      # commits before scanning; comment writing is disabled below, so the
      # token never needs write access.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks-action scans a commit range; a shallow clone hides the
          # base commit on a push to `main`.
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings live in the job summary and SARIF artifact; inline review
          # comments would need `pull-requests: write`.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Static analysis with two registry configs: the language-agnostic security
  # audit and the generic secret rules. Semgrep's Dart coverage is thin, so
  # this job is mostly a cross-language safety net; gitleaks and Dependabot are
  # the real wins here. `semgrep ci` is deliberately not used because it
  # requires a SEMGREP_APP_TOKEN; `semgrep scan` runs the same rules from the
  # public registry without an account.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep
      - name: Scan
        # semgrep exits non-zero when it reports findings, which is expected
        # while the job is report-only. Keep the SARIF step running so the
        # findings are still published as an artifact.
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30
